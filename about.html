<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>at Portfolio</title>
  <link rel="icon" type="image/x-icon" href="resources/locked.ico">
  <style>
    body {
      background: #dcdcdc;
      color: #000;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    #lockScreen {
      width: 100%;
      margin-top: 120px;
      text-align: center;
    }

    .lock-card {
      width: 360px;
      margin: auto;
      background: #fff;
      border: 1px solid #888;
      padding: 20px;
    }

    .lock-icon {
      font-size: 42px;
      display: block;
      margin-bottom: 10px;
    }

    .lock-eyebrow {
      font-size: 11px;
      color: #666;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .lock-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .lock-sub {
      font-size: 13px;
      color: #444;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .text-pin-wrap {
      display: block;
    }

    .text-pin-wrap input {
      width: 90%;
      padding: 8px;
      border: 1px solid #888;
      font-size: 14px;
      font-family: Arial, sans-serif;
    }

    .text-pin-btn {
      margin-top: 10px;
      width: 95%;
      padding: 8px;
      border: 1px solid #555;
      background: #efefef;
      cursor: pointer;
      font-size: 14px;
    }

    .text-pin-btn:hover {
      background: #ddd;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 12px;
      color: red;
      min-height: 18px;
    }

    .attempts-left {
      margin-top: 8px;
      font-size: 11px;
      color: #555;
    }

    #lockoutMsg {
      display: none;
      margin-top: 10px;
      font-size: 12px;
      color: red;
    }

    #lockoutMsg.visible {
      display: block;
    }

    #resumeFrame {
      display: none;
      width: 100%;
      min-height: 100vh;
      border: none;
    }

    #resumeFrame.visible {
      display: block;
    }
  </style>
</head>

<div id="lockScreen">
  <div class="lock-card">
    <span class="lock-icon" id="lockIcon"></span>
    <div class="lock-eyebrow">Locked</div>
    <div class="lock-title"></div>
    <p class="lock-sub">
      Enter your passphrase to continue.
    </p>

    <div class="text-pin-wrap" id="passphraseMode">
      <input type="password" id="passphraseInput" placeholder="Enter passphrase" autocomplete="off"
        onkeydown="if(event.key==='Enter') submitPassphrase()"/>
      <button class="text-pin-btn" onclick="submitPassphrase()">Unlock</button>
    </div>

    <div class="status-msg" id="statusMsg"></div>
    <div class="attempts-left" id="attemptsLeft"></div>
    <div id="lockoutMsg"></div>
  </div>
</div>

<iframe id="resumeFrame" sandbox="allow-same-origin allow-scripts"></iframe>

<script>
  var attempts     = 0;
  var maxAttempts  = 5;
  var lockedOut    = false;
  var lockoutUntil = 0;

  async function submitPassphrase() {
    if (lockedOut) return;

    var val = document.getElementById('passphraseInput').value;
    if (!val) return;

    tryUnlock(val);
  }

  async function tryUnlock(pin) {
    if (lockedOut) return;

    if (ENCRYPTED === 'PASTE_ENCRYPTED_PAYLOAD_HERE') {
      setStatus('No encrypted content found.', 'error');
      return;
    }

    setStatus('Verifying...', 'loading');
    disableInput(true);

    try {
      var raw      = atob(ENCRYPTED);
      var bytes    = new Uint8Array(raw.length);

      for (var i = 0; i < raw.length; i++) {
        bytes[i] = raw.charCodeAt(i);
      }

      var salt       = bytes.slice(0, 16);
      var iv         = bytes.slice(16, 28);
      var ciphertext = bytes.slice(28);

      var enc = new TextEncoder();

      var keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(pin),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      var key = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 310000,
          hash: 'SHA-256'
        },
        keyMaterial,
        {
          name: 'AES-GCM',
          length: 256
        },
        false,
        ['decrypt']
      );

      var plaintext = await crypto.subtle.decrypt(
        {
          name: 'AES-GCM',
          iv: iv
        },
        key,
        ciphertext
      );

      var html = new TextDecoder().decode(plaintext);
      unlockSuccess(html);

    } catch (e) {
      onWrongPin();
    }
  }

  function unlockSuccess(html) {
    document.getElementById('lockScreen').style.display = 'none';

    var frame = document.getElementById('resumeFrame');

    frame.classList.add('visible');
    frame.srcdoc = html;
  }

  function onWrongPin() {
    attempts++;

    var remaining = maxAttempts - attempts;

    setStatus('Incorrect passphrase.', 'error');

    var el = document.getElementById('attemptsLeft');

    el.textContent =
      remaining + ' attempt' + (remaining === 1 ? '' : 's') + ' remaining';

    if (remaining <= 0) {
      startLockout();
      return;
    }

    setTimeout(function () {
      document.getElementById('passphraseInput').value = '';
      disableInput(false);
    }, 500);
  }

  function startLockout() {
    lockedOut    = true;
    lockoutUntil = Date.now() + 30000;

    document.getElementById('attemptsLeft').textContent = '';

    var lo = document.getElementById('lockoutMsg');

    lo.classList.add('visible');

    tick();
  }

  function tick() {
    var left = Math.ceil((lockoutUntil - Date.now()) / 1000);

    if (left <= 0) {
      lockedOut = false;
      attempts  = 0;

      document.getElementById('lockoutMsg').classList.remove('visible');
      document.getElementById('lockoutMsg').textContent = '';
      document.getElementById('attemptsLeft').textContent = '';

      clearStatus();

      document.getElementById('passphraseInput').value = '';

      disableInput(false);

      return;
    }

    document.getElementById('lockoutMsg').textContent =
      'Too many failed attempts. Try again in ' +
      left +
      ' second' +
      (left === 1 ? '' : 's') +
      '.';

    setTimeout(tick, 1000);
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('statusMsg');

    el.textContent = msg;
    el.className = 'status-msg' + (cls ? ' ' + cls : '');
  }

  function clearStatus() {
    setStatus('', '');
  }

  function disableInput(v) {
    var pp = document.getElementById('passphraseInput');

    if (pp) pp.disabled = v;

    document.querySelector('.text-pin-btn').disabled = v;
  }
</script>

</body>
</html>
