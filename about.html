<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Resume — Avaneesh Thakur</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:  #0d1b2a;
      --steel: #1e3a5f;
      --sky:   #4a9edd;
      --ice:   #a8d8f0;
      --cream: #f5f0e8;
      --gold:  #e8a020;
      --gray:  #8a9ab0;
      --red:   #e05555;
    }

    body {
      background: var(--navy);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── LOCK SCREEN ── */
    #lockScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    #lockScreen::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent, transparent 40px,
        rgba(74,158,221,.03) 40px, rgba(74,158,221,.03) 41px
      );
      pointer-events: none;
    }

    .lock-card {
      background: rgba(30,58,95,.5);
      border: 1px solid rgba(74,158,221,.25);
      border-radius: 16px;
      padding: 48px 52px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
    }

    .lock-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
      transition: transform .3s ease;
    }
    .lock-icon.shake {
      animation: shake .4s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-5px); }
      80%       { transform: translateX(5px); }
    }

    .lock-eyebrow {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: .28em;
      font-size: .75rem;
      color: var(--sky);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .lock-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      letter-spacing: .05em;
      color: #fff;
      margin-bottom: 8px;
    }
    .lock-sub {
      font-size: .88rem;
      color: var(--gray);
      margin-bottom: 32px;
      line-height: 1.55;
    }

    /* PIN dots display */
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gray);
      background: transparent;
      transition: background .15s, border-color .15s, transform .15s;
    }
    .dot.filled {
      background: var(--sky);
      border-color: var(--sky);
      transform: scale(1.1);
    }
    .dot.error {
      background: var(--red);
      border-color: var(--red);
    }

    /* Numpad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .key {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(74,158,221,.18);
      border-radius: 10px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.2rem;
      font-weight: 500;
      padding: 16px;
      cursor: pointer;
      transition: background .15s, transform .1s, border-color .15s;
      user-select: none;
    }
    .key:hover  { background: rgba(74,158,221,.18); border-color: rgba(74,158,221,.4); }
    .key:active { transform: scale(.95); background: rgba(74,158,221,.28); }
    .key.del    { font-size: .95rem; color: var(--gray); }
    .key.go {
      background: var(--sky);
      border-color: var(--sky);
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: .1em;
      font-size: 1rem;
    }
    .key.go:hover  { background: #5aaee8; }
    .key.go:active { transform: scale(.95); }
    .key.go:disabled { background: var(--gray); cursor: not-allowed; }

    /* Passphrase toggle */
    .toggle-mode {
      font-size: .8rem;
      color: var(--sky);
      cursor: pointer;
      text-decoration: underline;
      margin-top: 4px;
      display: inline-block;
      transition: color .2s;
    }
    .toggle-mode:hover { color: var(--ice); }

    /* Text PIN input (passphrase mode) */
    .text-pin-wrap {
      display: none;
      margin-bottom: 20px;
    }
    .text-pin-wrap.visible { display: block; }
    .text-pin-wrap input {
      width: 100%;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(74,158,221,.3);
      border-radius: 8px;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 12px 16px;
      text-align: center;
      letter-spacing: .15em;
      outline: none;
      transition: border-color .2s;
    }
    .text-pin-wrap input:focus { border-color: var(--sky); }
    .text-pin-btn {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: var(--sky);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .12em;
      cursor: pointer;
      transition: background .2s;
    }
    .text-pin-btn:hover { background: #5aaee8; }

    .status-msg {
      font-size: .82rem;
      margin-top: 12px;
      min-height: 20px;
      transition: color .2s;
    }
    .status-msg.error   { color: var(--red); }
    .status-msg.loading { color: var(--sky); }

    .attempts-left {
      font-size: .75rem;
      color: var(--gray);
      margin-top: 8px;
    }
    .attempts-left.warn { color: var(--gold); }
    .attempts-left.crit { color: var(--red); }

    /* Lockout overlay */
    #lockoutMsg {
      display: none;
      margin-top: 16px;
      background: rgba(224,85,85,.12);
      border: 1px solid rgba(224,85,85,.35);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: .85rem;
      color: var(--red);
      line-height: 1.5;
    }
    #lockoutMsg.visible { display: block; }

    /* ── RESUME FRAME ── */
    #resumeFrame {
      display: none;
      width: 100%;
      min-height: 100vh;
      border: none;
    }
    #resumeFrame.visible { display: block; }
  </style>
</head>
<body>

    <p class="lock-sub">Enter your PIN to view this resume.<br>This page is encrypted — the PIN is never stored.</p>

    <!-- Numpad mode -->
    <div id="numpadMode">
      <div class="pin-dots" id="pinDots">
        <div class="dot" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>

             onkeydown="if(event.key==='Enter') submitPassphrase()"/>

    </div>

<!-- RESUME renders here after unlock -->
<iframe id="resumeFrame" sandbox="allow-same-origin allow-scripts"></iframe>

<script>
  var pinBuffer    = '';
  var maxLen       = 6;
  var attempts     = 0;
  var maxAttempts  = 5;
  var lockedOut    = false;
  var lockoutUntil = 0;
  var numpadMode   = true;

  // ── Numpad logic ──
  function pressKey(k) {
    if (lockedOut || pinBuffer.length >= maxLen) return;
    pinBuffer += k;
    updateDots();
    if (pinBuffer.length === maxLen) {
      setTimeout(submitPin, 120);
    }
  }

  function pressDelete() {
    pinBuffer = pinBuffer.slice(0, -1);
    updateDots();
    clearStatus();
  }

  function updateDots() {
    for (var i = 0; i < maxLen; i++) {
      var dot = document.getElementById('d' + i);
      dot.classList.toggle('filled', i < pinBuffer.length);
      dot.classList.remove('error');
    }
  }

  function toggleMode() {
    numpadMode = !numpadMode;
    document.getElementById('numpadMode').style.display    = numpadMode ? '' : 'none';
    document.getElementById('passphraseMode').classList.toggle('visible', !numpadMode);
    document.getElementById('toggleBtn').textContent =
      numpadMode ? 'Switch to passphrase mode' : 'Switch to numpad mode';
    pinBuffer = '';
    updateDots();
    clearStatus();
    if (!numpadMode) setTimeout(function(){ document.getElementById('passphraseInput').focus(); }, 50);
  }

  function submitPin() {
    if (lockedOut) return;
    if (!pinBuffer) return;
    tryUnlock(pinBuffer);
  }

  function submitPassphrase() {
    if (lockedOut) return;
    var val = document.getElementById('passphraseInput').value;
    if (!val) return;
    tryUnlock(val);
  }

  // ── Core decrypt ──
  async function tryUnlock(pin) {
    if (lockedOut) return;
    if (ENCRYPTED === 'PASTE_ENCRYPTED_PAYLOAD_HERE') {
      setStatus('No encrypted content found. Run encryptor.html first.', 'error');
      return;
    }
    setStatus('Verifying...', 'loading');
    disableInput(true);

    try {
      var raw      = atob(ENCRYPTED);
      var bytes    = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

      var salt       = bytes.slice(0, 16);
      var iv         = bytes.slice(16, 28);
      var ciphertext = bytes.slice(28);

      var enc = new TextEncoder();
      var keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      var key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      var plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ciphertext
      );

      // Success
      var html = new TextDecoder().decode(plaintext);
      unlockSuccess(html);

    } catch (e) {
      // Wrong PIN — decryption throws
      onWrongPin();
    }
  }

  function unlockSuccess(html) {
    document.getElementById('lockScreen').style.display = 'none';
    var frame = document.getElementById('resumeFrame');
    frame.classList.add('visible');
    frame.srcdoc = html;
  }

  function onWrongPin() {
    attempts++;
    var remaining = maxAttempts - attempts;
    dotError();

    if (remaining <= 0) {
      startLockout();
      return;
    }

    shake();
    setStatus('Incorrect PIN.', 'error');
    var el = document.getElementById('attemptsLeft');
    el.textContent = remaining + ' attempt' + (remaining === 1 ? '' : 's') + ' remaining';
    el.className = 'attempts-left' + (remaining <= 2 ? ' crit' : remaining <= 3 ? ' warn' : '');

    setTimeout(function () {
      pinBuffer = '';
      updateDots();
      if (!numpadMode) document.getElementById('passphraseInput').value = '';
      disableInput(false);
    }, 700);
  }

  function startLockout() {
    lockedOut    = true;
    lockoutUntil = Date.now() + 30000;
    document.getElementById('attemptsLeft').textContent = '';
    var lo = document.getElementById('lockoutMsg');
    lo.classList.add('visible');
    shake();
    tick();
  }

  function tick() {
    var left = Math.ceil((lockoutUntil - Date.now()) / 1000);
    if (left <= 0) {
      lockedOut = false;
      attempts  = 0;
      document.getElementById('lockoutMsg').classList.remove('visible');
      document.getElementById('lockoutMsg').textContent = '';
      document.getElementById('attemptsLeft').textContent = '';
      clearStatus();
      pinBuffer = '';
      updateDots();
      if (!numpadMode) document.getElementById('passphraseInput').value = '';
      disableInput(false);
      return;
    }
    document.getElementById('lockoutMsg').textContent =
      'Too many failed attempts. Try again in ' + left + ' second' + (left === 1 ? '' : 's') + '.';
    setStatus('', '');
    setTimeout(tick, 1000);
  }

  function dotError() {
    for (var i = 0; i < maxLen; i++) {
      var d = document.getElementById('d' + i);
      d.classList.remove('filled');
      d.classList.add('error');
    }
  }

  function shake() {
    var icon = document.getElementById('lockIcon');
    icon.classList.remove('shake');
    void icon.offsetWidth;
    icon.classList.add('shake');
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg' + (cls ? ' ' + cls : '');
  }

  function clearStatus() {
    setStatus('', '');
  }

  function disableInput(v) {
    document.querySelectorAll('.key').forEach(function(k){ k.disabled = v; });
    var pp = document.getElementById('passphraseInput');
    if (pp) pp.disabled = v;
  }

  // Keyboard support for numpad
  document.addEventListener('keydown', function(e) {
    if (!numpadMode || lockedOut) return;
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    if (e.key === 'Backspace') pressDelete();
    if (e.key === 'Enter') submitPin();
  });
</script>
</body>
</html>
